name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: work/asset_atlas_native
    steps:
      # v7, not v4: v4 runs on Node 20, which GitHub has deprecated and now
      # forces onto Node 24 while warning in every run's log. v7 ships on
      # Node 24. Its one behaviour change that could bite -- refusing to
      # check out a fork's head -- applies to pull_request_target and
      # workflow_run, which this workflow does not use.
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed against
          # (flutter --version on the maintainer machine, Dart 3.12.2 —
          # pubspec.yaml requires sdk ^3.12.2). Bump deliberately.
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Must run before the tests: test/native_fbx_importer_test.dart looks for
      # build/windows/x64/runner/Release/asset_atlas_mesh_importer.exe and
      # SKIPS ITSELF (reporting green) when it is absent. Building here is what
      # makes the native FBX coverage real.
      - run: flutter build windows --release

      - run: flutter test
